<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nordstrom $750 Exclusive Offer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .pulse-cta {
            animation: pulse-subtle 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-stone-50 min-h-screen flex flex-col justify-between text-stone-900 font-sans antialiased">

    <!-- Top Notification Banner (Rotating Social Proof) -->
    <div class="w-full py-3 flex justify-center items-center px-4">
        <div id="social-proof" class="inline-flex items-center gap-2 bg-white border border-stone-300 shadow-sm px-4 py-1.5 rounded-sm text-xs md:text-sm font-medium tracking-wide transition-all duration-500 opacity-100">
            <svg class="w-4 h-4 text-stone-800" fill="currentColor" viewBox="0 0 20 20">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
            </svg>
            <span id="proof-text"><strong class="font-bold">Madison T.</strong> claimed $750!</span>
        </div>
    </div>

    <!-- Main Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-4">
        <div class="bg-white w-full max-w-md rounded-lg shadow-sm border border-stone-200 p-6 md:p-8 text-center">
            
            <!-- Brand Header -->
            <h1 class="text-xl md:text-2xl font-black tracking-[0.2em] uppercase text-stone-900 mb-4">
                NORDSTROM
            </h1>
            
            <div class="w-full border-t border-stone-200 mb-6"></div>

            <!-- Offer Header -->
            <div class="mb-8">
                <div class="text-3xl md:text-4xl font-extrabold text-stone-900 tracking-tight mb-1">
                    $750
                </div>
                <div class="text-xs uppercase tracking-[0.25em] font-semibold text-stone-500">
                    EXCLUSIVE OFFER
                </div>
            </div>

            <!-- Step-by-Step Box Container -->
            <div class="border border-stone-300 rounded-md divide-y divide-stone-200 text-left mb-8 bg-stone-50/50">
                
                <!-- Step 1 -->
                <div class="flex items-center p-3.5 md:p-4">
                    <div class="w-7 h-7 bg-stone-900 text-white text-xs font-bold flex items-center justify-center rounded-sm mr-3.5 flex-shrink-0">
                        1
                    </div>
                    <span class="text-sm font-medium text-stone-800">Click The Button Below</span>
                </div>

                <!-- Step 2 -->
                <div class="flex items-center p-3.5 md:p-4">
                    <div class="w-7 h-7 bg-stone-900 text-white text-xs font-bold flex items-center justify-center rounded-sm mr-3.5 flex-shrink-0">
                        2
                    </div>
                    <span class="text-sm font-medium text-stone-800">Enter Your Basic Info</span>
                </div>

                <!-- Step 3 -->
                <div class="flex items-center p-3.5 md:p-4">
                    <div class="w-7 h-7 bg-stone-900 text-white text-xs font-bold flex items-center justify-center rounded-sm mr-3.5 flex-shrink-0">
                        3
                    </div>
                    <span class="text-sm font-medium text-stone-800">Complete Required Offers</span>
                </div>

                <!-- Step 4 -->
                <div class="flex items-center p-3.5 md:p-4">
                    <div class="w-7 h-7 bg-stone-900 text-white text-xs font-bold flex items-center justify-center rounded-sm mr-3.5 flex-shrink-0">
                        4
                    </div>
                    <span class="text-sm font-medium text-stone-800">Claim Your Reward</span>
                </div>

            </div>

            <!-- High-Impact CTA Button with Affiliate Link -->
            <a href="https://linkthem.net/?offer_id=4632&aff_id=3083" target="_blank" rel="noopener noreferrer" class="pulse-cta block w-full bg-black hover:bg-stone-800 text-white font-bold py-4 px-6 rounded-sm uppercase tracking-wider text-sm transition-all shadow-md">
                Claim Your Reward &rarr;
            </a>

        </div>
    </main>

    <!-- Footer Security Information -->
    <footer class="w-full py-6 text-center text-[11px] text-stone-500 tracking-wide">
        SSL Secured &bull; Encrypted &bull; Verified &bull; 100% Safe<br>
        &copy; 2026
    </footer>

    <!-- JavaScript for Live Rotating Social Proof -->
    <script>
        const names = [
            "Madison T.", "Ashley K.", "Jessica M.", "Samantha R.", 
            "Brittany S.", "Emily W.", "Amanda L.", "Rachel B.", "Hannah P."
        ];
        
        const amounts = ["$750", "$500", "$750", "$1,000"];

        function rotateProof() {
            const proofEl = document.getElementById('social-proof');
            const textEl = document.getElementById('proof-text');
            
            // Fade out
            proofEl.style.opacity = '0';
            
            setTimeout(() => {
                const randomName = names[Math.floor(Math.random() * names.length)];
                const randomAmount = amounts[Math.floor(Math.random() * amounts.length)];
                textEl.innerHTML = `<strong class="font-bold">${randomName}</strong> claimed ${randomAmount}!`;
                
                // Fade in
                proofEl.style.opacity = '1';
            }, 500);
        }

        // Change every 4 seconds
        setInterval(rotateProof, 4000);
    </script>
</body>
</html>
